[project]
name = "zao-skill-runner"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "greenlet>=3.1",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
