[project]
name = "za-agugent-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115", "pydantic>=2.8", "pydantic-settings>=2.4", "sqlalchemy>=2.0", "greenlet>=3.1", "aiosqlite>=0.20", "alembic>=1.13", "uvicorn>=0.30", "httpx>=0.27", "openai>=1.60"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.22", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff.lint]
ignore = ["RUF012", "DTZ003", "SIM102", "BLE001", "TRY004", "B017", "C408"]
